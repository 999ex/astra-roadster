<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Astra Roadster</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500&family=Shippori+Mincho:wght@700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0f17;--fg:#e9e3d3;--accent:#c9a45c;--muted:#8b8577;--btn-bg:rgba(20,24,33,.72);--btn-border:rgba(201,164,92,.35);--btn-active:#c9a45c;--btn-active-fg:#15120b}
body[data-theme="studio"]{--bg:#efe6dc;--fg:#2a211b;--accent:#9a3b2c;--muted:#7a6d62;--btn-bg:rgba(255,250,244,.78);--btn-border:rgba(154,59,44,.3);--btn-active:#9a3b2c;--btn-active-fg:#fff8f1}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--fg);font-family:'Noto Sans JP',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
#stage{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.hud-title{position:fixed;left:24px;top:20px;pointer-events:none}
.eyebrow{font-size:11px;letter-spacing:.28em;color:var(--accent)}
.hud-title h1{font-family:'Shippori Mincho',serif;font-size:clamp(28px,5vw,44px);margin:4px 0 6px;letter-spacing:.06em}
.spec{margin:0;font-size:12px;color:var(--muted)}
.spec b{color:var(--fg);font-weight:500}
.theme-switch{position:fixed;right:20px;top:20px;display:flex;border:1px solid var(--btn-border);border-radius:999px;overflow:hidden;background:var(--btn-bg);backdrop-filter:blur(8px)}
.theme-switch button{font:inherit;font-size:12px;color:var(--muted);background:none;border:0;padding:7px 14px;cursor:pointer}
.theme-switch button.is-active{background:var(--btn-active);color:var(--btn-active-fg)}
.controls{position:fixed;left:50%;bottom:44px;transform:translateX(-50%);display:flex;gap:10px;flex-wrap:wrap;justify-content:center;width:calc(100% - 32px);max-width:900px}
.btn{font:inherit;font-size:14px;color:var(--fg);background:var(--btn-bg);border:1px solid var(--btn-border);border-radius:8px;padding:10px 18px;cursor:pointer;backdrop-filter:blur(8px);transition:background .2s,border-color .2s,color .2s}
.btn:hover{border-color:var(--accent)}
.btn.is-active{background:var(--btn-active);color:var(--btn-active-fg);border-color:var(--btn-active)}
.view-group{display:flex;border:1px solid var(--btn-border);border-radius:8px;overflow:hidden;backdrop-filter:blur(8px)}
.view-group .btn{border:0;border-radius:0;backdrop-filter:none}
.view-group .btn+.btn{border-left:1px solid var(--btn-border)}
.hint{position:fixed;bottom:14px;left:0;right:0;text-align:center;font-size:11px;color:var(--muted);pointer-events:none;padding:0 16px}
.tooltip{position:fixed;left:0;top:0;pointer-events:none;padding:6px 10px;font-size:13px;border-radius:6px;background:var(--btn-bg);border:1px solid var(--accent);color:var(--fg);opacity:0;transition:opacity .15s;white-space:nowrap;backdrop-filter:blur(8px)}
.tooltip.show{opacity:1}
@media (max-width:600px){
  .hud-title{left:16px;top:14px}
  .theme-switch{right:16px;top:14px}
  .controls{bottom:56px;gap:6px}
  .btn{padding:8px 12px;font-size:13px}
}
</style>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}
</script>
</head>
<body data-theme="gallery">
<canvas id="stage"></canvas>
<div class="hud-title">
  <div class="eyebrow">ROADSTER · No.01</div>
  <h1>Astra Roadster</h1>
  <p class="spec">部品 <b id="part-count">61</b> 点 ／ ボディ・シャーシ・EVドライブ ／ シザードア</p>
</div>
<div class="theme-switch" role="group" aria-label="テーマ">
  <button type="button" data-theme-btn="gallery" class="is-active">展示室</button>
  <button type="button" data-theme-btn="studio">スタジオ</button>
</div>
<div class="controls">
  <button type="button" class="btn" id="btn-drive">始動</button>
  <button type="button" class="btn" id="btn-explode">パーツ分解</button>
  <div class="view-group" role="group" aria-label="視点">
    <button type="button" class="btn" data-view="top">上</button>
    <button type="button" class="btn" data-view="side">横</button>
    <button type="button" class="btn" data-view="front">正面</button>
  </div>
  <button type="button" class="btn" id="btn-reset">視点リセット</button>
</div>
<div class="hint">ドラッグで回転 ・ ホイール／ピンチで拡大縮小 ・ 部品にカーソルを重ねると名称を表示</div>
<div class="tooltip" id="tooltip"></div>
<!-- BUNDLE -->
</body>
</html>
