<title>Astra Roadster</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500&family=Shippori+Mincho:wght@700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0f17;--fg:#e9e3d3;--accent:#c9a45c;--muted:#8b8577;--btn-bg:rgba(20,24,33,.72);--btn-border:rgba(201,164,92,.35);--btn-active:#c9a45c;--btn-active-fg:#15120b}
body[data-theme="studio"]{--bg:#efe6dc;--fg:#2a211b;--accent:#9a3b2c;--muted:#7a6d62;--btn-bg:rgba(255,250,244,.78);--btn-border:rgba(154,59,44,.3);--btn-active:#9a3b2c;--btn-active-fg:#fff8f1}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--fg);font-family:'Noto Sans JP',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
#stage{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.hud-title{position:fixed;left:24px;top:20px;pointer-events:none}
.eyebrow{font-size:11px;letter-spacing:.28em;color:var(--accent)}
.hud-title h1{font-family:'Shippori Mincho',serif;font-size:clamp(28px,5vw,44px);margin:4px 0 6px;letter-spacing:.06em}
.spec{margin:0;font-size:12px;color:var(--muted)}
.spec b{color:var(--fg);font-weight:500}
.theme-switch{position:fixed;right:20px;top:20px;display:flex;border:1px solid var(--btn-border);border-radius:999px;overflow:hidden;background:var(--btn-bg);backdrop-filter:blur(8px)}
.theme-switch button{font:inherit;font-size:12px;color:var(--muted);background:none;border:0;padding:7px 14px;cursor:pointer}
.theme-switch button.is-active{background:var(--btn-active);color:var(--btn-active-fg)}
.controls{position:fixed;left:50%;bottom:44px;transform:translateX(-50%);display:flex;gap:10px;flex-wrap:wrap;justify-content:center;width:calc(100% - 32px);max-width:900px}
.btn{font:inherit;font-size:14px;color:var(--fg);background:var(--btn-bg);border:1px solid var(--btn-border);border-radius:8px;padding:10px 18px;cursor:pointer;backdrop-filter:blur(8px);transition:background .2s,border-color .2s,color .2s}
.btn:hover{border-color:var(--accent)}
.btn.is-active{background:var(--btn-active);color:var(--btn-active-fg);border-color:var(--btn-active)}
.view-group{display:flex;border:1px solid var(--btn-border);border-radius:8px;overflow:hidden;backdrop-filter:blur(8px)}
.view-group .btn{border:0;border-radius:0;backdrop-filter:none}
.view-group .btn+.btn{border-left:1px solid var(--btn-border)}
.hint{position:fixed;bottom:14px;left:0;right:0;text-align:center;font-size:11px;color:var(--muted);pointer-events:none;padding:0 16px}
.tooltip{position:fixed;left:0;top:0;pointer-events:none;padding:6px 10px;font-size:13px;border-radius:6px;background:var(--btn-bg);border:1px solid var(--accent);color:var(--fg);opacity:0;transition:opacity .15s;white-space:nowrap;backdrop-filter:blur(8px)}
.tooltip.show{opacity:1}
@media (max-width:600px){
  .hud-title{left:16px;top:14px}
  .theme-switch{right:16px;top:14px}
  .controls{bottom:56px;gap:6px}
  .btn{padding:8px 12px;font-size:13px}
}
</style>

</script>

import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";
import { Reflector } from "three/addons/objects/Reflector.js";

// src/math.js
var lerp = (a, b, t) => a + (b - a) * t;
var clamp = (v, lo = 0, hi = 1) => Math.min(hi, Math.max(lo, v));
function sampleArray(arr, t) {
  const f = clamp(t) * (arr.length - 1);
  const i = Math.min(arr.length - 2, Math.floor(f));
  return lerp(arr[i], arr[i + 1], f - i);
}
var easeInOutCubic = (t) => t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
var approach = (cur, target, step) => cur < target ? Math.min(target, cur + step) : Math.max(target, cur - step);

// src/views.js
var VIEWS = {
  reset: { position: [5.6, 2.4, 4.8], target: [0, 0.55, 0] },
  top: { position: [-1e-3, 9.5, 0], target: [0, 0.4, 0] },
  side: { position: [0, 0.75, -8.6], target: [0, 0.55, 0] },
  front: { position: [8.6, 0.8, 0], target: [0, 0.55, 0] }
};
var VIEW_DURATION = 0.8;
var MAX_POLAR_ANGLE = 1.56;
function toSpherical([x, y, z], [tx, ty, tz]) {
  const dx = x - tx, dy = y - ty, dz = z - tz;
  const r = Math.hypot(dx, dy, dz);
  return { r, phi: Math.acos(clamp(dy / r, -1, 1)), theta: Math.atan2(dx, dz) };
}
function fromSpherical({ r, phi, theta }, [tx, ty, tz]) {
  return [tx + r * Math.sin(phi) * Math.sin(theta), ty + r * Math.cos(phi), tz + r * Math.sin(phi) * Math.cos(theta)];
}
function shortestAngle(a, b) {
  let d = (b - a) % (2 * Math.PI);
  if (d > Math.PI) d -= 2 * Math.PI;
  if (d < -Math.PI) d += 2 * Math.PI;
  return d;
}
function interpolateView(from, to, t) {
  const e = easeInOutCubic(t);
  const target = [0, 1, 2].map((i) => lerp(from.target[i], to.target[i], e));
  const a = toSpherical(from.position, from.target);
  const b = toSpherical(to.position, to.target);
  const s = { r: lerp(a.r, b.r, e), phi: lerp(a.phi, b.phi, e), theta: a.theta + shortestAngle(a.theta, b.theta) * e };
  return { position: fromSpherical(s, target), target };
}
function createViewAnimator(camera, controls) {
  let anim = null;
  return {
    go(name) {
      anim = { from: { position: camera.position.toArray(), target: controls.target.toArray() }, to: VIEWS[name], t: 0 };
    },
    get active() {
      return anim !== null;
    },
    update(dt) {
      if (!anim) return;
      anim.t = Math.min(1, anim.t + dt / VIEW_DURATION);
      const v = interpolateView(anim.from, anim.to, anim.t);
      camera.position.set(...v.position);
      controls.target.set(...v.target);
      if (anim.t >= 1) anim = null;
    }
  };
}

// src/stage.js
var PEDESTAL_HEIGHT = 0.08;
function createPolarGrid() {
  const g = new THREE.Group();
  const mat = new THREE.LineBasicMaterial({ color: 3817552, transparent: true, opacity: 0.55 });
  for (const r of [4, 6, 8, 11, 15, 20]) {
    const pts = [];
    for (let i = 0; i <= 128; i++) {
      const a = i / 128 * Math.PI * 2;
      pts.push(new THREE.Vector3(Math.cos(a) * r, 0, Math.sin(a) * r));
    }
    g.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), mat));
  }
  for (let i = 0; i < 24; i++) {
    const a = i / 24 * Math.PI * 2;
    const p = (r) => new THREE.Vector3(Math.cos(a) * r, 0, Math.sin(a) * r);
    g.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints([p(3.4), p(20)]), mat));
  }
  return g;
}
function createStage(canvas) {
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  const scene = new THREE.Scene();
  const pmrem = new THREE.PMREMGenerator(renderer);
  scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
  pmrem.dispose();
  const camera = new THREE.PerspectiveCamera(35, 1, 0.1, 100);
  camera.position.set(5.6, 2.4, 4.8);
  const controls = new OrbitControls(camera, canvas);
  controls.target.set(0, 0.55, 0);
  Object.assign(controls, { enableDamping: true, dampingFactor: 0.08, minDistance: 3, maxDistance: 16, maxPolarAngle: MAX_POLAR_ANGLE, enablePan: false });
  const key = new THREE.DirectionalLight(16777215, 2.2);
  key.position.set(4, 7, 3);
  key.castShadow = true;
  key.shadow.mapSize.set(2048, 2048);
  Object.assign(key.shadow.camera, { left: -5, right: 5, top: 5, bottom: -5, near: 1, far: 20 });
  key.shadow.bias = -5e-4;
  const rim = new THREE.DirectionalLight(16769732, 1);
  rim.position.set(-5, 3, -4);
  const hemi = new THREE.HemisphereLight(16777215, 2105376, 0.35);
  scene.add(key, rim, hemi);
  const disc = new THREE.Mesh(new THREE.CylinderGeometry(3.2, 3.3, PEDESTAL_HEIGHT, 96), new THREE.MeshStandardMaterial({ color: 14273716, metalness: 0.2, roughness: 0.45 }));
  disc.position.y = PEDESTAL_HEIGHT / 2;
  disc.receiveShadow = true;
  const ring = new THREE.Mesh(new THREE.TorusGeometry(3.25, 0.025, 12, 128), new THREE.MeshStandardMaterial({ color: 13214812, metalness: 1, roughness: 0.3 }));
  ring.rotation.x = Math.PI / 2;
  ring.position.y = PEDESTAL_HEIGHT;
  const inset = new THREE.Mesh(new THREE.CircleGeometry(2.7, 96), new THREE.MeshStandardMaterial({ color: 12106948, metalness: 0.6, roughness: 0.35 }));
  inset.rotation.x = -Math.PI / 2;
  inset.position.y = PEDESTAL_HEIGHT + 1e-3;
  inset.receiveShadow = true;
  scene.add(disc, ring, inset);
  const grid = createPolarGrid();
  const mirror = new Reflector(new THREE.CircleGeometry(40, 64), { textureWidth: 1024, textureHeight: 1024, color: 8947848 });
  mirror.rotation.x = -Math.PI / 2;
  const tint = new THREE.Mesh(new THREE.CircleGeometry(40, 64), new THREE.MeshBasicMaterial({ color: 15326672, transparent: true, opacity: 0.78 }));
  tint.rotation.x = -Math.PI / 2;
  tint.position.y = 2e-3;
  scene.add(grid, mirror, tint);
  const car = new THREE.Group();
  car.position.y = PEDESTAL_HEIGHT;
  scene.add(car);
  function resize() {
    const w = canvas.clientWidth, h = canvas.clientHeight;
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
  }
  window.addEventListener("resize", resize);
  resize();
  return { renderer, scene, camera, controls, car, floors: { grid, mirror, tint }, lights: { key, rim, hemi } };
}

// src/themes.js
import * as THREE2 from "three";
var THEMES = {
  gallery: { bg: ["#141a26", "#06080d"], grid: true, mirror: false, exposure: 1, hemi: 0.35, key: 2.2 },
  studio: { bg: ["#f3ebe2", "#d9cdbf"], grid: false, mirror: true, exposure: 1.05, hemi: 0.6, key: 1.8 }
};
function gradientTexture([top, bottom]) {
  const c = document.createElement("canvas");
  c.width = 2;
  c.height = 256;
  const g = c.getContext("2d");
  const grad = g.createLinearGradient(0, 0, 0, 256);
  grad.addColorStop(0, top);
  grad.addColorStop(1, bottom);
  g.fillStyle = grad;
  g.fillRect(0, 0, 2, 256);
  const t = new THREE2.CanvasTexture(c);
  t.colorSpace = THREE2.SRGBColorSpace;
  return t;
}
function applyTheme(stage2, name) {
  const th = THEMES[name];
  const old = stage2.scene.background;
  stage2.scene.background = gradientTexture(th.bg);
  old?.dispose?.();
  stage2.floors.grid.visible = th.grid;
  stage2.floors.mirror.visible = th.mirror;
  stage2.floors.tint.visible = th.mirror;
  stage2.renderer.toneMappingExposure = th.exposure;
  stage2.lights.hemi.intensity = th.hemi;
  stage2.lights.key.intensity = th.key;
  document.body.dataset.theme = name;
  document.querySelectorAll("[data-theme-btn]").forEach((b) => b.classList.toggle("is-active", b.dataset.themeBtn === name));
}

import * as THREE3 from "three";
function createMaterials() {
  const std = (o) => new THREE3.MeshStandardMaterial(o);
  return {

  out.push(spec("\u30ED\u30FC\u30EB\u30D5\u30FC\u30D7", "exterior", worldAssembly(hoops), [-0.3, 2, 0]));
  return out;
}

import * as THREE7 from "three";
import { RoundedBoxGeometry as RoundedBoxGeometry2 } from "three/addons/geometries/RoundedBoxGeometry.js";
var TIRE_WIDTH = 0.24;
function spinning(position, children) {
  const outer = new THREE7.Group();
  outer.position.set(...position);
  const spin = new THREE7.Group();
  for (const c of children) spin.add(c);
  outer.add(spin);
  outer.userData.spin = spin;
  return outer;
}
function tireGeometry(R, w) {
  const ri = 0.72 * R;
  const pts = [[ri, -w / 2], [R - 0.03, -w / 2], [R - 5e-3, -w / 2 + 0.02], [R, -w / 2 + 0.05], [R, w / 2 - 0.05], [R - 5e-3, w / 2 - 0.02], [R - 0.03, w / 2], [ri, w / 2]].map(([x, y]) => new THREE7.Vector2(x, y));
  return new THREE7.LatheGeometry(pts, 64);
}
function rimChildren(R, s, m) {
  const ri = 0.72 * R;
  const face = s * (TIRE_WIDTH / 2 - 0.03);
  const kids = [
    mesh(alongZ(new THREE7.CylinderGeometry(ri, ri, TIRE_WIDTH * 0.9, 48, 1, true)), m.rim),
    mesh(alongZ(new THREE7.CylinderGeometry(0.06, 0.06, 0.05, 24)), m.copper, [0, 0, face]),
    mesh(new THREE7.TorusGeometry(ri * 0.97, 6e-3, 6, 64), m.copper, [0, 0, face])
  ];
  for (let k = 0; k < 5; k++) {
    const a = k / 5 * Math.PI * 2;
    const spoke = new THREE7.BoxGeometry(0.045, ri * 0.92, 0.022);
    spoke.translate(0, ri * 0.46, 0);
    const sp = mesh(spoke, m.rim, [0, 0, face]);
    sp.rotation.set(0, 0.35 * s, a, "ZYX");
    kids.push(sp);
  }
  return kids;
}
function buildWheels(bp, m) {
  const [front, rear] = bp.wheels;
  const out = [];
  for (const [axle, wheel] of [["\u524D", front], ["\u5F8C", rear]]) {
    const R = wheel.radius;
    const x = uToX(bp, wheel.u);
    const W = profileAt(bp, wheel.u).W;
    for (const [side, s] of [["\u53F3", 1], ["\u5DE6", -1]]) {
      const zc = s * (W - 0.02 - TIRE_WIDTH / 2);
      const pos = side + axle;
      const rd = 0.58 * R;
      const zDisc = zc - s * 0.05;
      out.push(spec(`${pos}\u30BF\u30A4\u30E4`, "wheels", spinning([x, R, zc], [mesh(alongZ(tireGeometry(R, TIRE_WIDTH)), m.tire)]), [0, 0.3, s * 0.95]));
      out.push(spec(`${pos}\u30DB\u30A4\u30FC\u30EB`, "wheels", spinning([x, R, zc], rimChildren(R, s, m)), [0, 0.3, s * 0.65]));
      out.push(spec(`${pos}\u30D6\u30EC\u30FC\u30AD\u30C7\u30A3\u30B9\u30AF`, "wheels", spinning([x, R, zDisc], [
        mesh(alongZ(new THREE7.CylinderGeometry(rd, rd, 0.028, 48)), m.steel),
        mesh(alongZ(new THREE7.CylinderGeometry(rd * 0.4, rd * 0.4, 0.06, 32)), m.copper)
      ]), [0, 0.3, s * 0.4]));
      const caliper = new THREE7.Group();
      caliper.position.set(x - rd * 0.6, R + rd * 0.6, zDisc);
      caliper.rotation.z = Math.PI / 4;
      caliper.add(mesh(new RoundedBoxGeometry2(0.16, 0.09, 0.07, 2, 0.02), m.copper));
      out.push(spec(`${pos}\u30AD\u30E3\u30EA\u30D1\u30FC`, "wheels", caliper, [0, 0.45, s * 0.25]));
    }
  }
  return out;
}

import * as THREE9 from "three";
import { RoundedBoxGeometry as RoundedBoxGeometry4 } from "three/addons/geometries/RoundedBoxGeometry.js";
function buildChassis(bp, m) {
  const out = [];
  const [wf, wr] = bp.wheels;
  const xf = uToX(bp, wf.u), xr = uToX(bp, wr.u);
  const railZ = 0.8 * profileAt(bp, 0.5).zIn;
  const floor = seatLayout(bp).floor;
  const fx0 = xf + 0.45, fx1 = xr - 0.3, fLen = fx0 - fx1, fMid = (fx0 + fx1) / 2;
  const bx0 = xf - wf.radius - 0.15, bx1 = xr + wr.radius + 0.15;
  const maxBcFrame = maxBcOverX(bp, fx1, fx0);
  const railH = 0.03;
  const bandLow = Math.max(maxBcFrame + 0.01, wf.radius + 0.04);
  const bandHigh = floor - 5e-3;
  if (bandLow + railH > bandHigh) {
    throw new Error(`\u30B7\u30E3\u30FC\u30B7\u30D5\u30EC\u30FC\u30E0\u306E\u9AD8\u3055\u5E2F\u304C\u53CD\u8EE2\uFF08\u307E\u305F\u306F\u30EC\u30FC\u30EB\u9AD8\u3088\u308A\u72ED\u3044\uFF09: \u4E0B\u9650 ${bandLow.toFixed(4)} + \u30EC\u30FC\u30EB\u9AD8 ${railH} > \u4E0A\u9650 ${bandHigh.toFixed(4)}\uFF08\u8ECA\u4F53\u4E0B\u9762\u306E\u6700\u9AD8\u70B9 ${maxBcFrame.toFixed(4)}\u3001\u5185\u88C5\u30D5\u30ED\u30A2 ${floor.toFixed(4)}\uFF09\u3002blueprint \u3092\u78BA\u8A8D\u3057\u3066\u304F\u3060\u3055\u3044\u3002`);
  }
  const yFrame = (bandLow + bandHigh) / 2;
  const frame = [
    mesh(new THREE9.BoxGeometry(fLen, railH, 0.05), m.steel, [fMid, yFrame, railZ]),
    mesh(new THREE9.BoxGeometry(fLen, railH, 0.05), m.steel, [fMid, yFrame, -railZ])
  ];
  for (const cx of [fx0, bx0 + 0.04, bx1 - 0.04, fx1]) frame.push(mesh(new THREE9.BoxGeometry(0.05, railH, 2 * railZ), m.steel, [cx, yFrame, 0]));
  out.push(spec("\u30B7\u30E3\u30FC\u30B7\u30D5\u30EC\u30FC\u30E0", "chassis", worldAssembly(frame), [0, 0, 0]));
  const bLen = bx0 - bx1, bMid = (bx0 + bx1) / 2, bW = 2 * railZ - 0.08;
  const maxBcBattery = maxBcOverX(bp, bx1, bx0);
  const battLow = maxBcBattery + 5e-3;
  const battHigh = floor - 5e-3;
  const battBudget = battHigh - battLow;
  if (battBudget <= 0) {
    throw new Error(`\u30D0\u30C3\u30C6\u30EA\u30FC\u306E\u9AD8\u3055\u4E88\u7B97\u304C\u3042\u308A\u307E\u305B\u3093: ${battBudget.toFixed(4)} m\uFF08\u4E0B\u9650 ${battLow.toFixed(4)} \u2265 \u4E0A\u9650 ${battHigh.toFixed(4)}\uFF09\u3002blueprint \u3092\u78BA\u8A8D\u3057\u3066\u304F\u3060\u3055\u3044\u3002`);
  }
  const trayH = 0.01, connH = 8e-3;
  const moduleH = Math.max(0.02, battBudget - trayH - connH - 4e-3);
  const caseWallH = trayH + moduleH;
  const trayY = battLow + trayH / 2;
  const wallY = battLow + caseWallH / 2;
  const moduleY = battLow + trayH + moduleH / 2;
  const connY = battLow + trayH + moduleH + connH / 2;
  out.push(spec("\u30D0\u30C3\u30C6\u30EA\u30FC\u30B1\u30FC\u30B9", "chassis", worldAssembly([
    mesh(new THREE9.BoxGeometry(bLen, trayH, bW), m.aluminum, [bMid, trayY, 0]),
    mesh(new THREE9.BoxGeometry(bLen, caseWallH, 0.015), m.aluminum, [bMid, wallY, bW / 2]),
    mesh(new THREE9.BoxGeometry(bLen, caseWallH, 0.015), m.aluminum, [bMid, wallY, -bW / 2])
  ]), [0, 0.05, 0]));
  let k = 0;
  for (let ix = 0; ix < 3; ix++) for (const iz of [-1, 1]) {
    k++;
    const mx = bMid + (ix - 1) * bLen / 3, mz = iz * bW / 4;
    out.push(spec(`\u30D0\u30C3\u30C6\u30EA\u30FC\u30E2\u30B8\u30E5\u30FC\u30EB${k}`, "chassis", worldAssembly([
      mesh(new RoundedBoxGeometry4(bLen / 3 - 0.04, moduleH, bW / 2 - 0.04, 2, 8e-3), m.battery, [mx, moduleY, mz]),
      mesh(new THREE9.BoxGeometry(0.05, connH, 0.08), m.copper, [mx, connY, mz])
    ]), [(ix - 1) * 0.35, 0.12, iz * 0.45]));
  }
  for (const [name, x, R, sgn] of [["\u30D5\u30ED\u30F3\u30C8\u30E2\u30FC\u30BF\u30FC", xf, wf.radius, 1], ["\u30EA\u30A2\u30E2\u30FC\u30BF\u30FC", xr, wr.radius, -1]]) {
    out.push(spec(name, "chassis", worldAssembly([
      mesh(alongZ(new THREE9.CylinderGeometry(0.13, 0.13, 0.3, 32)), m.aluminum, [x, R, 0]),
      mesh(new THREE9.TorusGeometry(0.13, 0.018, 10, 40), m.copper, [x, R, 0.13]),
      mesh(new THREE9.TorusGeometry(0.13, 0.018, 10, 40), m.copper, [x, R, -0.13]),
      mesh(alongZ(new THREE9.CylinderGeometry(0.05, 0.05, 0.38, 16)), m.steel, [x, R, 0])
    ]), [sgn * 0.75, 0.15, 0]));
  }
  const inverter = [mesh(new RoundedBoxGeometry4(0.25, 0.08, 0.3, 2, 0.015), m.aluminum, [xr + 0.32, wr.radius + 0.12, 0])];
  for (let i = 0; i < 5; i++) inverter.push(mesh(new THREE9.BoxGeometry(0.22, 0.03, 8e-3), m.steel, [xr + 0.32, wr.radius + 0.175, -0.12 + i * 0.06]));
  out.push(spec("\u30A4\u30F3\u30D0\u30FC\u30BF\u30FC", "chassis", worldAssembly(inverter), [-1, 0.45, 0]));
  for (const [axle, x, w] of [["\u524D", xf, wf], ["\u5F8C", xr, wr]]) {
    const W = profileAt(bp, w.u).W;
    for (const [side, s] of [["\u53F3", 1], ["\u5DE6", -1]]) {
      const zHub = s * (W - 0.02 - TIRE_WIDTH - 0.02);
      const z0 = s * 0.19;
      out.push(spec(`\u30C9\u30E9\u30A4\u30D6\u30B7\u30E3\u30D5\u30C8${side}${axle}`, "chassis", worldAssembly([
        mesh(alongZ(new THREE9.CylinderGeometry(0.022, 0.022, Math.abs(zHub - z0), 12)), m.steel, [x, w.radius, (z0 + zHub) / 2]),
        mesh(new THREE9.SphereGeometry(0.04, 16, 12), m.interior, [x, w.radius, z0 + s * 0.03]),
        mesh(new THREE9.SphereGeometry(0.04, 16, 12), m.interior, [x, w.radius, zHub - s * 0.03])
      ]), [0, 0.1, s * 0.45]));
      const zS = s * (W - 0.02 - TIRE_WIDTH - 0.08);
      const y0 = w.radius - 0.02;
      const helix = Array.from({ length: 73 }, (_, i) => {
        const a = i / 72 * Math.PI * 2 * 6;
        return [x - 0.1 + 0.045 * Math.cos(a), y0 + 0.32 * i / 72, zS + 0.045 * Math.sin(a)];
      });
      out.push(spec(`\u30B5\u30B9\u30DA\u30F3\u30B7\u30E7\u30F3${side}${axle}`, "chassis", worldAssembly([
        mesh(tubeThrough(helix, 8e-3, 240), m.copper),
        mesh(new THREE9.CylinderGeometry(0.022, 0.022, 0.4, 12), m.aluminum, [x - 0.1, y0 + 0.16, zS])
      ]), [0, 0.55, s * 0.55]));
    }
  }
  const rackHousingR = 0.045;
  const yRack = Math.min(wf.radius + 0.02, yFrame - railH / 2 - 3e-3 - rackHousingR);
  out.push(spec("\u30B9\u30C6\u30A2\u30EA\u30F3\u30B0\u30E9\u30C3\u30AF", "chassis", worldAssembly([
    mesh(alongZ(new THREE9.CylinderGeometry(0.03, 0.03, 2 * railZ + 0.1, 16)), m.steel, [xf + 0.2, yRack, 0]),
    mesh(alongZ(new THREE9.CylinderGeometry(rackHousingR, rackHousingR, 0.18, 16)), m.aluminum, [xf + 0.2, yRack, -0.15])
  ]), [0.55, 0.1, 0]));
  const xRad = uToX(bp, 0.06);
  const pR = profileAt(bp, 0.06);
  const radW = Math.min(0.8, 2 * pR.zIn * 0.9);
  const yRad = pR.Bc + 0.18;
  const radiator = [mesh(new THREE9.BoxGeometry(0.05, 0.26, radW), m.aluminum, [xRad, yRad, 0])];
  for (let i = 0; i < 8; i++) radiator.push(mesh(new THREE9.BoxGeometry(0.056, 8e-3, radW * 0.95), m.steel, [xRad, yRad - 0.11 + i * 0.031, 0]));
  out.push(spec("\u30E9\u30B8\u30A8\u30FC\u30BF\u30FC", "chassis", worldAssembly(radiator), [1.3, 0.35, 0]));
  return out;
}

var BUILDERS = [buildExterior, buildWheels, buildInterior, buildChassis];
var stage = createStage(document.getElementById("stage"));
applyTheme(stage, "gallery");
var views = createViewAnimator(stage.camera, stage.controls);
var mats = createMaterials();
var registry = createRegistry();
for (const build of BUILDERS) {
  for (const s of build(BLUEPRINT, mats)) {
    stage.car.add(s.object3d);
    registry.add(s);
  }
}
var explode = createExplodeController(registry);
var drive = createDrive({
  hinges: [["\u30B7\u30B6\u30FC\u30C9\u30A2\u53F3", 1], ["\u30B7\u30B6\u30FC\u30C9\u30A2\u5DE6", -1]].map(([name, side]) => ({ hinge: registry.get(name).object3d.userData.hinge, side })),
  spinners: registry.parts.map((p) => p.object3d.userData.spin).filter(Boolean),
  lights: [{ material: mats.headlight, max: 2.5 }, { material: mats.taillight, max: 3 }]
});
setupUI({ stage, registry, explode, drive, views, applyTheme: (n) => applyTheme(stage, n) });
var clock = new THREE10.Clock();
stage.renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 0.05);
  explode.update(dt);
  drive.update(dt);
  views.update(dt);
  stage.controls.update();
  stage.renderer.render(stage.scene, stage.camera);
});
window.__viewer = { stage, views, registry, explode, drive, applyTheme: (n) => applyTheme(stage, n) };
</script>
</body>
</html>
